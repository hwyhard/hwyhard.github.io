  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"zh-CN\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>双方同时弹卡 · 镜像文案对照<\u002Ftitle>\n<!-- bundler: JS-referenced resources -->\n\n<style>/* ============================================================\n   语音房好友推荐 — 设计 Tokens (基础底图主题)\n   深色语音房 · 年轻轻盈有呼吸感 · 不花哨\n   bg rgba(8,18,40,.9) · 描边 rgba(255,255,255,.08)\n   ============================================================ */\n:root{\n  /* ---------- 背景 / 画布 ---------- */\n  --bg:           #081228;                 /* rgba(8,18,40) 主背景      */\n  --bg-deep:      #050B1A;                 /* 更深，做底部/渐变收口     */\n  --bg-grad:      radial-gradient(120% 80% at 50% -10%, #0E1B3C 0%, #081228 46%, #060C1C 100%);\n\n  /* ---------- 表面 / 卡片 ---------- */\n  --surface-1:    rgba(255,255,255,0.04);  /* 气泡 / 浅卡片             */\n  --surface-2:    rgba(255,255,255,0.07);  /* 输入框 / 功能按钮         */\n  --surface-3:    rgba(255,255,255,0.10);  /* hover / 选中              */\n  --surface-solid:#0F1A38;                 /* 不透明面板 (底栏/弹层)    */\n\n  /* ---------- 描边 ---------- */\n  --border:        rgba(255,255,255,0.08); /* 默认低对比描边            */\n  --border-strong: rgba(255,255,255,0.14); /* 强调描边 / 分割           */\n  --border-faint:  rgba(255,255,255,0.05);\n\n  /* ---------- 文字 ---------- */\n  --text-1: rgba(255,255,255,0.92);        /* 主文字                    */\n  --text-2: rgba(255,255,255,0.56);        /* 次要 / 说明               */\n  --text-3: rgba(255,255,255,0.34);        /* 占位 / 禁用               */\n\n  /* ---------- 主色 / 强调色 ---------- */\n  --primary:     #7B8CFF;                  /* 主色 · periwinkle，链接/在麦环/品牌 */\n  --primary-soft:rgba(123,140,255,0.16);   /* 主色低饱和底               */\n  --accent:      #FF6E8E;                   /* 强调色 · 珊瑚玫瑰，加好友/送花 CTA  */\n  --accent-press:#F2547A;                   /* 强调色按压                 */\n  --accent-soft: rgba(255,110,142,0.16);\n\n  /* ---------- 快捷互动三色 (回应闭环复用，已收敛) ---------- */\n  --flower: #FF6E8E;   /* 送花 = 强调色 */\n  --call:   #FFC24B;   /* 打 call       */\n  --veg:    #7BD86A;   /* 扔菜          */\n\n  /* ---------- 功能色 ---------- */\n  --online:  #36D399;  /* 在线 / 在麦说话 */\n  --warn:    #FFC24B;\n  --danger:  #FF5C6C;  /* 失败 / 静音红   */\n  --male:    #57B8FF;  /* 性别 男         */\n  --female:  #FF8FB6;  /* 性别 女         */\n\n  /* ---------- 圆角 ---------- */\n  --r-sm:     10px;   /* 小标签 / 小按钮     */\n  --r-bubble: 14px;   /* 公屏气泡            */\n  --r-card:   18px;   /* 推荐卡片 / 大卡片   */\n  --r-field:  22px;   /* 输入框 / 胶囊按钮高半径 */\n  --r-pill:   999px;  /* 全胶囊 / 圆形       */\n\n  /* ---------- 间距 (4pt) ---------- */\n  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;\n\n  /* ---------- 阴影 / 投影 (克制) ---------- */\n  --shadow-card:  0 8px 24px rgba(0,0,0,0.28);\n  --shadow-pop:   0 16px 40px rgba(0,0,0,0.45);\n  --ring-mic:     0 0 0 2px rgba(123,140,255,0.9);   /* 在麦说话环 */\n  --ring-accent:  0 0 0 2px var(--accent);\n\n  /* ---------- 字体 ---------- */\n  --font: \"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",-apple-system,\n          BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n  --font-num: \"SF Pro Rounded\",\"PingFang SC\",system-ui,sans-serif;\n\n  /* ---------- 字号层级 (移动端) ---------- */\n  --fs-title:   16px;  --fw-title:   600;  /* 房间名 / 段标题   */\n  --fs-body:    14px;  --fw-body:    400;  /* 公屏正文          */\n  --fs-label:   13px;  --fw-label:   500;  /* 按钮 / 昵称        */\n  --fs-caption: 12px;  --fw-caption: 400;  /* 元信息 / 理由文案  */\n  --fs-micro:   11px;  --fw-micro:   600;  /* 徽标 / 计数        */\n}\n<\u002Fstyle>\n\n<style>\n  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }\n  html,body{ margin:0; height:100%; background:#04060f; font-family:var(--font); }\n  body{ display:flex; align-items:center; justify-content:center; overflow:hidden; }\n  .viewport{ width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }\n\n  /* ===== stage ===== */\n  .stage{ width:1600px; height:1040px; position:relative; flex:none; transform-origin:center center; }\n\n  /* ===== header ===== */\n  .header{ position:absolute; top:42px; left:0; right:0; text-align:center; }\n  .eyebrow{ display:inline-flex; align-items:center; gap:7px; font:600 11px var(--font);\n            letter-spacing:.18em; text-transform:uppercase; color:var(--accent);\n            border:1px solid rgba(255,110,142,.38); border-radius:var(--r-pill);\n            padding:5px 14px; background:rgba(255,110,142,.08); margin-bottom:12px; }\n  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); }\n  .header h1{ font:700 34px/1.12 var(--font); color:#fff; margin:0 0 9px; letter-spacing:.01em; }\n  .header p{ font:400 14.5px/1.6 var(--font); color:var(--text-2); margin:0 auto; max-width:760px; }\n  .header p b{ color:var(--text-1); font-weight:600; }\n\n  /* ===== sync badge ===== */\n  .sync{ position:absolute; top:236px; left:50%; transform:translateX(-50%);\n         display:inline-flex; align-items:center; gap:8px; z-index:8;\n         background:var(--surface-1); color:var(--text-1); font:600 13px var(--font);\n         padding:8px 18px; border-radius:var(--r-pill); border:1px solid var(--border-strong);\n         box-shadow:var(--shadow-pop); white-space:nowrap; }\n  .sync .blink{ width:7px; height:7px; border-radius:50%; background:var(--online);\n                box-shadow:0 0 0 3px rgba(54,211,153,.22); }\n\n  /* ===== mirror axis ===== */\n  .axis{ position:absolute; left:800px; top:274px; bottom:192px; width:0;\n         border-left:1.5px dashed rgba(255,255,255,.13); z-index:1; }\n  .axis-badge{ position:absolute; left:800px; top:572px; transform:translate(-50%,-50%);\n               z-index:8; display:flex; flex-direction:column; align-items:center; gap:7px; }\n  .axis-badge .ring{ width:54px; height:54px; border-radius:50%; background:var(--surface-solid);\n                     border:1px solid var(--border-strong); display:flex; align-items:center;\n                     justify-content:center; box-shadow:var(--shadow-card); color:var(--accent); }\n  .axis-badge .ring svg{ width:24px; height:24px; }\n  .axis-badge .lab{ font:700 11px var(--font); color:var(--text-3); letter-spacing:.1em;\n                    text-align:center; line-height:1.4; }\n  .axis-badge .lab small{ display:block; font:600 9px var(--font); letter-spacing:.26em;\n                           color:var(--text-3); margin-top:1px; opacity:.7; }\n\n  /* ===== columns ===== */\n  .col{ position:absolute; top:274px; width:316px; }\n  .col.a{ left:376px; }\n  .col.b{ left:908px; }\n\n  .col-tag{ display:flex; align-items:center; gap:9px; margin-bottom:13px; justify-content:center; }\n  .col-tag .badge{ font:700 12px var(--font); letter-spacing:.06em; padding:5px 14px;\n                   border-radius:var(--r-pill); color:#fff; }\n  .col.a .badge{ background:var(--primary); }\n  .col.b .badge{ background:var(--accent); }\n  .col-tag .role{ font:500 12px var(--font); color:var(--text-2); }\n\n  /* ===== phone ===== */\n  .phone{ width:316px; height:644px; flex:none; position:relative; overflow:hidden;\n          background:var(--bg-grad); border-radius:42px; color:var(--text-1);\n          border:1px solid var(--border); box-shadow:0 44px 96px rgba(0,0,0,.65);\n          display:flex; flex-direction:column; }\n  /* status bar */\n  .status{ height:40px; flex:none; display:flex; align-items:center;\n           justify-content:space-between; padding:0 22px;\n           font:600 13px var(--font-num); color:var(--text-1); }\n  .status .right{ display:flex; align-items:center; gap:6px; }\n  /* room top bar */\n  .topbar{ flex:none; display:flex; align-items:center; gap:8px; padding:0 13px 8px; }\n  .iconbtn{ width:28px; height:28px; flex:none; display:flex; align-items:center;\n            justify-content:center; background:none; border:none; color:var(--text-1); }\n  .roomcap{ display:flex; align-items:center; gap:8px; background:var(--surface-1);\n            border:1px solid var(--border); border-radius:var(--r-pill);\n            padding:4px 11px 4px 4px; min-width:0; }\n  .roomcap img{ width:26px; height:26px; border-radius:50%; object-fit:cover; flex:none; }\n  .roomcap .nm{ font:600 12px/1.1 var(--font); white-space:nowrap; overflow:hidden;\n                text-overflow:ellipsis; max-width:88px; }\n  .roomcap .rid{ font:400 10px/1.2 var(--font-num); color:var(--text-3); margin-top:1px; }\n  .follow{ background:transparent; border:1px solid var(--border-strong); color:var(--text-1);\n           border-radius:var(--r-pill); font:600 11px var(--font); padding:4px 11px; flex:none; }\n  .spc{ flex:1; }\n  .livebadge{ display:inline-flex; align-items:center; gap:5px; background:var(--surface-1);\n              border:1px solid var(--border); border-radius:var(--r-pill);\n              padding:4px 9px; font:600 11px var(--font-num); color:var(--text-2); }\n  .livebadge .dot{ width:6px; height:6px; border-radius:50%; background:var(--online);\n                   box-shadow:0 0 0 3px rgba(54,211,153,.18); }\n  /* body */\n  .body{ flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column; }\n  /* seats */\n  .seats{ padding:10px 14px 3px; }\n  .seat-host{ display:flex; justify-content:center; margin-bottom:14px; }\n  .seat-row{ display:grid; grid-template-columns:repeat(4,1fr); justify-items:center; gap:4px; }\n  .seat{ display:flex; flex-direction:column; align-items:center; gap:6px; }\n  .ava{ position:relative; }\n  .ava>img{ border-radius:50%; object-fit:cover; display:block; }\n  .seat .ava>img{ width:44px; height:44px; }\n  .seat-host .ava>img{ width:52px; height:52px; }\n  .ava.speaking{ box-shadow:var(--ring-mic); border-radius:50%; }\n  .gnd{ position:absolute; right:-2px; bottom:-2px; width:15px; height:15px; border-radius:50%;\n        display:flex; align-items:center; justify-content:center; font:700 8px var(--font);\n        color:#fff; border:2px solid var(--bg); }\n  .gnd.m{ background:var(--male); } .gnd.f{ background:var(--female); }\n  .empty{ width:44px; height:44px; border-radius:50%; background:var(--surface-1);\n          border:1px dashed var(--border-strong); display:flex; align-items:center;\n          justify-content:center; color:var(--text-3); }\n  .seat .who{ font:500 10px/1 var(--font); color:var(--text-1); max-width:58px;\n              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n  .seat.empty-s .who{ color:var(--text-3); }\n  .host-tag{ font:600 9px var(--font); color:var(--primary); margin-top:-3px; }\n  /* chat */\n  .chat{ margin-top:auto; padding:0 12px 4px; display:flex; flex-direction:column; gap:7px;\n         overflow:hidden; -webkit-mask-image:linear-gradient(180deg,transparent,#000 20%); }\n  .sysmsg{ align-self:center; font:400 10px/1.3 var(--font); color:var(--text-3);\n           background:var(--surface-1); border-radius:var(--r-pill); padding:3px 10px; }\n  .bubble{ max-width:82%; background:var(--surface-1); border:1px solid var(--border-faint);\n           border-radius:var(--r-bubble); padding:6px 9px; }\n  .bubble .who{ font:600 10px/1 var(--font); color:var(--primary); }\n  .bubble .who.f{ color:var(--female); }\n  .bubble .txt{ display:block; margin-top:3px; font:400 12px/1.4 var(--font); color:var(--text-1); }\n  /* bottom bar */\n  .bottombar{ flex:none; display:flex; align-items:center; gap:7px; padding:7px 12px 20px; }\n  .composer{ flex:1; display:flex; align-items:center; gap:7px; background:var(--surface-2);\n             border:1px solid var(--border); border-radius:var(--r-field); padding:7px 11px; }\n  .composer .emo{ color:var(--text-2); display:flex; }\n  .composer .ph{ flex:1; font:400 12px var(--font); color:var(--text-3); }\n  .fbtn{ width:34px; height:34px; flex:none; border-radius:50%; background:var(--surface-2);\n         border:1px solid var(--border); display:flex; align-items:center;\n         justify-content:center; color:var(--text-1); }\n  .fbtn.mic{ background:var(--primary-soft); border-color:rgba(123,140,255,.4); color:var(--primary); }\n  .home{ position:absolute; left:50%; bottom:6px; transform:translateX(-50%);\n         width:96px; height:4px; border-radius:3px; background:rgba(255,255,255,.28); }\n  /* focus scrim */\n  .focus-scrim{ position:absolute; inset:0; z-index:3; pointer-events:none;\n    background:linear-gradient(180deg,rgba(5,9,20,.58) 0%,rgba(5,9,20,.22) 30%,transparent 52%); }\n\n  /* ===== scard wrapper (marks live here, outside clipped scard) ===== */\n  .scard-wrap{ position:absolute; left:11px; right:11px; bottom:13px; z-index:6; }\n\n  /* ===== scard ===== */\n  .scard{ width:100%; background:linear-gradient(180deg,#13204A 0%,var(--surface-solid) 60%);\n          border:1px solid var(--border-strong); border-radius:var(--r-card);\n          box-shadow:var(--shadow-pop); overflow:hidden; position:relative; }\n  .scard::before{ content:\"\"; position:absolute; left:0; right:0; top:0; height:56px;\n                  pointer-events:none; border-radius:var(--r-card) var(--r-card) 0 0;\n    background:radial-gradient(120% 100% at 50% 0%,rgba(255,110,142,.24),transparent 72%); }\n  .sc-close{ position:absolute; top:9px; right:9px; z-index:3; width:23px; height:23px;\n             border-radius:50%; background:rgba(255,255,255,.08); border:1px solid var(--border);\n             color:var(--text-2); display:flex; align-items:center; justify-content:center; }\n  .sc-main{ display:flex; flex-direction:column; align-items:center; padding:16px 16px 13px;\n            text-align:center; }\n  /* avatar */\n  .sc-ava{ position:relative; margin-bottom:8px; }\n  .sc-ava>img{ width:58px; height:58px; border-radius:50%; object-fit:cover;\n               box-shadow:0 0 0 3px rgba(255,110,142,.5),0 0 18px rgba(255,110,142,.38); }\n  .sc-ava .g{ position:absolute; right:0; bottom:0; width:17px; height:17px; border-radius:50%;\n              display:flex; align-items:center; justify-content:center; font:700 8px var(--font);\n              color:#fff; border:2px solid var(--surface-solid); }\n  .g.m{ background:var(--male); } .g.f{ background:var(--female); }\n  .sc-name{ font:600 15px var(--font); color:#fff; }\n  .sc-sub{ font:500 10px var(--font); color:var(--online); margin-top:3px;\n           display:inline-flex; align-items:center; gap:3px; }\n  .sc-sub::before{ content:\"\"; width:4px; height:4px; border-radius:50%; background:var(--online); }\n  .sc-reason{ font:400 13px/1.45 var(--font); color:var(--text-2); margin:9px 0 11px;\n              display:flex; align-items:center; gap:7px; }\n  .sc-reason .ln{ flex:1; height:1px; background:var(--border-strong); min-width:10px; }\n  .sc-reason .hl{ font-weight:600; }\n  .sc-reason .hl.ta{ color:var(--accent); }\n  .sc-reason .hl.you{ color:var(--primary); }\n  .free-tag{ display:inline-flex; align-items:center; gap:4px; padding:3px 11px;\n             border-radius:var(--r-pill); background:rgba(255,110,142,.13);\n             border:1px solid rgba(255,110,142,.30); font:600 10px var(--font);\n             color:var(--accent); margin-bottom:3px; white-space:nowrap; }\n  .sc-add{ width:100%; height:40px; background:var(--accent); color:#fff; border:none;\n           border-radius:var(--r-pill); font:600 14px var(--font); cursor:default;\n           display:flex; align-items:center; justify-content:center;\n           box-shadow:0 5px 14px rgba(255,110,142,.32); }\n  .cd{ width:100%; margin-top:10px; display:flex; align-items:center; gap:7px; }\n  .cd .track{ flex:1; height:3px; border-radius:3px; background:rgba(255,255,255,.10); overflow:hidden; }\n  .cd .bar{ height:100%; border-radius:3px; background:linear-gradient(90deg,var(--primary),#9aa6ff); }\n  .cd .txt{ font:400 10px var(--font); color:var(--text-3); white-space:nowrap; }\n\n  /* ===== callout marks (on scard-wrap, so they overflow scard) ===== */\n  .mark{ position:absolute; width:22px; height:22px; border-radius:50%; background:var(--accent);\n         color:#fff; font:700 12px var(--font-num); display:flex; align-items:center;\n         justify-content:center; z-index:10; box-shadow:0 4px 10px rgba(255,110,142,.35); }\n  /* m1 = avatar zone, top-left corner of card */\n  .mark.m1{ top:10px; left:-10px; }\n  /* m2 = reason text zone, roughly mid-card */\n  .mark.m2{ top:110px; left:-10px; }\n\n  /* ===== diff highlight rings (help the eye find the diff on each card) ===== */\n  .diff-ava .sc-ava>img{ box-shadow:0 0 0 3px var(--accent),0 0 18px rgba(255,110,142,.38); }\n  .diff-reason .sc-reason{ background:rgba(255,110,142,.06); border-radius:8px; padding:4px 7px; margin:9px -4px 11px; }\n\n  /* ===== legend ===== */\n  .legend{ position:absolute; left:96px; right:96px; top:946px; display:flex; gap:12px; }\n  .leg-card{ flex:1; background:var(--surface-1); border:1px solid var(--border);\n             border-radius:14px; padding:13px 16px; display:flex; align-items:center; gap:11px; }\n  .leg-card .num{ width:22px; height:22px; border-radius:50%; color:#fff; flex:none;\n                  font:700 12px var(--font-num); display:flex; align-items:center; justify-content:center; }\n  .leg-card .num.n1,.leg-card .num.n2{ background:var(--accent); }\n  .leg-card .num.eq{ background:var(--online); }\n  .leg-card .t{ font:400 13px/1.45 var(--font); color:var(--text-2); }\n  .leg-card .t b{ color:var(--text-1); font-weight:600; }\n  .chip{ display:inline-block; font-weight:700; border-radius:5px; padding:1px 6px; font-size:12px; }\n  .chip.ta{ color:var(--accent); background:var(--accent-soft); }\n  .chip.you{ color:var(--primary); background:var(--primary-soft); }\n  /* ===== 真实游戏界面底图 ===== */\n  .phone{ background:url(\"9e74422a-17f1-4a33-be30-35edb113f957\") center 32%/cover no-repeat !important; }\n  .phone .status, .phone .topbar{ background:rgba(0,0,0,.52) !important; }\n  .phone .bottombar{ background:rgba(0,0,0,.46) !important; }\n  .phone .body .seats{ display:none !important; }\n  /* ===== 本次新增功能 · 虚线标
